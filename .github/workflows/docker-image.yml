name: Docker image

# 双镜像构建 → 推 GHCR + 部署 47（单 job，同一 runner）
#
#   nx-as-base  —— 纯权限壳（nginx + nx-as，无主程序），供 `FROM ghcr.io/on-devplan/nx-as-base` 派生
#   nx-as       —— 默认产品形态（base + pi-web 主进程）
#
# 为什么 build 与 deploy 合在一个 job（改动前先读）：
#   分成两个 job 时它们跑在**不同 runner**上——deploy 里 docker save 会 "No such image"。
#   走 artifact 中转又要多一轮 250MB 上传下载。合并在同一 runner 后，
#   镜像构建完直接 `docker save | gzip | ssh 47 'docker load'` 流式上传，无中转。
#
# 为什么不用 appleboy/scp-action：253MB 经它转多次实测挂起（40min+ 无进展）。
# 为什么不用 47 直拉 GHCR：47 实测吞吐仅 0.6MB/s（6m54s），而管道上行 2.4MB/s。
on:
  push:
    tags: ['v*']
  workflow_dispatch:        # 手动触发
    inputs:
      deploy:
        description: '同时部署到 47 服务器'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write           # 推 GHCR 需要

jobs:
  build:
    name: Build images & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号
        id: meta
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "构建 nx-as:$V + nx-as-base:$V"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR 镜像名（小写归一）
        id: ghcr
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "base=ghcr.io/${OWNER}/nx-as-base" >> "$GITHUB_OUTPUT"
          echo "full=ghcr.io/${OWNER}/nx-as" >> "$GITHUB_OUTPUT"

      # ── base：纯权限壳（本地构建 → 冒烟 → 推 GHCR）──
      # 注意：不能在同一 build-push-action 里混「本地 tag + GHCR tag + push:true」——
      # buildx 会把 nx-as-base:local 当成 Docker Hub 的 library/nx-as-base 去推（实测 401）。
      - name: Build base 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: base
          load: true
          push: false
          tags: |
            nx-as-base:${{ steps.meta.outputs.version }}
            nx-as-base:local
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: 冒烟：base（无主进程也要能起，catch-all 404 而非 502）
        run: |
          set +e
          docker run -d --name smoke-base -p 18090:8080 nx-as-base:local
          ok=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/_nxas/api/auth/verify 2>/dev/null)
            if [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then ok=true; break; fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "::error::base 镜像 120s 内未就绪"; docker logs smoke-base --tail 60; docker rm -f smoke-base; exit 1
          fi
          curl -s http://127.0.0.1:18090/_nxas/api/auth/verify; echo
          docker logs smoke-base 2>&1 | grep -q '纯权限壳模式' || { echo "::error::base 未进入纯权限壳模式"; docker logs smoke-base --tail 30; docker rm -f smoke-base; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' http://127.0.0.1:18090/)
          echo "匿名 / → HTTP $code（应为 404：无主进程）"
          docker rm -f smoke-base
          [ "$code" = "404" ] || { echo "::error::base 匿名 / 应 404，实得 $code"; exit 1; }
          echo "✅ base 契约通过（网关就绪 + 纯权限壳 + catch-all 404）"

      - name: 推 base 到 GHCR
        run: |
          docker tag nx-as-base:${{ steps.meta.outputs.version }} ${{ steps.ghcr.outputs.base }}:${{ steps.meta.outputs.version }}
          docker tag nx-as-base:${{ steps.meta.outputs.version }} ${{ steps.ghcr.outputs.base }}:latest
          docker push ${{ steps.ghcr.outputs.base }}:${{ steps.meta.outputs.version }}
          docker push ${{ steps.ghcr.outputs.base }}:latest

      # ── full：base + pi-web ──
      - name: Build full 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: full
          load: true
          push: false
          tags: |
            nx-as:${{ steps.meta.outputs.version }}
            nx-as:local
          cache-from: |
            type=gha,scope=full
            type=gha,scope=base
          cache-to: type=gha,mode=max,scope=full

      - name: 冒烟：full（路径契约）
        run: |
          set +e
          docker run -d --name smoke -p 18080:8080 -e NX_AS_TOKEN=smoketoken nx-as:local
          ok=false
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/_nxas/api/auth/verify 2>/dev/null)
            if [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then ok=true; break; fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "::error::full 镜像 180s 内未就绪"; docker logs smoke --tail 80; docker rm -f smoke; exit 1
          fi
          curl -s http://127.0.0.1:18080/_nxas/api/auth/verify; echo
          docker logs smoke 2>&1 | grep -q '启动主进程' || { echo "::error::full 未启动 pi-web"; docker logs smoke --tail 40; docker rm -f smoke; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' http://127.0.0.1:18080/)
          code2=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/_nxas/m/v1/sessions)
          echo "匿名 / → $code（应 302）；匿名 m/v1 → $code2（应 401）"
          docker rm -f smoke
          [ "$code" = "302" ] || { echo "::error::匿名 / 应 302，实得 $code"; exit 1; }
          [ "$code2" = "401" ] || { echo "::error::匿名 API 应 401，实得 $code2"; exit 1; }
          echo "✅ full 契约通过"

      - name: 推 full 到 GHCR
        run: |
          docker tag nx-as:${{ steps.meta.outputs.version }} ${{ steps.ghcr.outputs.full }}:${{ steps.meta.outputs.version }}
          docker tag nx-as:${{ steps.meta.outputs.version }} ${{ steps.ghcr.outputs.full }}:latest
          docker push ${{ steps.ghcr.outputs.full }}:${{ steps.meta.outputs.version }}
          docker push ${{ steps.ghcr.outputs.full }}:latest

      - name: GHCR 推送结果
        run: |
          {
            echo "### GHCR 镜像"
            echo "- \`${{ steps.ghcr.outputs.base }}:${{ steps.meta.outputs.version }}\` （纯权限壳，FROM 派生用）"
            echo "- \`${{ steps.ghcr.outputs.full }}:${{ steps.meta.outputs.version }}\` （含 pi-web，直接运行）"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 部署 47（同一 runner，镜像就在本地）──
      - name: 准备 SSH
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy == true
        env:
          SSH_KEY: ${{ secrets.SSH47_KEY }}
          HOST: ${{ secrets.SSH47_HOST }}
          PORT: ${{ secrets.SSH47_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 流式上传镜像并 load（docker save | gzip | ssh docker load）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy == true
        env:
          HOST: ${{ secrets.SSH47_HOST }}
          USER: ${{ secrets.SSH47_USER || 'root' }}
          PORT: ${{ secrets.SSH47_PORT || '22' }}
        run: |
          set -o pipefail
          IMAGE="${{ steps.ghcr.outputs.full }}:${{ steps.meta.outputs.version }}"
          SIZE=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "镜像 $IMAGE ($((SIZE/1024/1024)) MB) 流式上传中（-1 快压：瓶颈是链路不是 CPU）..."
          docker save "$IMAGE" | gzip -1 | ssh -p "$PORT" -i ~/.ssh/deploy_key \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$USER@$HOST" "docker load"
          echo "✅ 镜像已 load 到 47"

      - name: 写 compose + 起服务 + 健康检查
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy == true
        env:
          HOST: ${{ secrets.SSH47_HOST }}
          USER: ${{ secrets.SSH47_USER || 'root' }}
          PORT: ${{ secrets.SSH47_PORT || '22' }}
          IMAGE: ${{ steps.ghcr.outputs.full }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # 远端脚本走 stdin；变量用命令行前缀传（ssh SetEnv 依赖远端 sshd AcceptEnv，不可靠）
          ssh -p "$PORT" -i ~/.ssh/deploy_key -o ConnectTimeout=20 \
            "$USER@$HOST" "IMAGE='$IMAGE' VERSION='$VERSION' sh -s" <<'REMOTE'
          set -e
          cd /opt/nx-as
          mkdir -p data

          # compose 由 CI 生成（单一事实来源；不再外挂服务器旧文件 → 根治版本漂移）
          cat > docker-compose.yml <<COMPOSE_EOF
          services:
            nx-as:
              image: ${IMAGE}:${VERSION}
              container_name: nx-as
              ports:
                - "18080:8080"
              volumes:
                - ./data:/data
              environment:
                NX_AS_STORE: /data/store.json
                NX_AS_TOKEN: \${NX_AS_TOKEN:-}
              restart: unless-stopped
              mem_limit: 700m
              logging:
                driver: json-file
                options: { max-size: "10m", max-file: "3" }
          COMPOSE_EOF

          echo "启动 ${IMAGE}:${VERSION}"
          docker compose up -d --force-recreate

          echo "健康检查..."
          ok=false
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18080/_nxas/api/auth/verify >/dev/null 2>&1; then ok=true; break; fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "健康检查失败，容器日志："
            docker compose logs --tail 100
            exit 1
          fi
          echo "探活 OK:"; curl -s http://127.0.0.1:18080/_nxas/api/auth/verify; echo
          echo "匿名 / → $(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' http://127.0.0.1:18080/)（应 302）"
          echo "匿名 m/v1 → $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/_nxas/m/v1/sessions)（应 401）"
          docker compose ps
          REMOTE

      - name: 清理旧镜像
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy == true
        env:
          HOST: ${{ secrets.SSH47_HOST }}
          USER: ${{ secrets.SSH47_USER || 'root' }}
          PORT: ${{ secrets.SSH47_PORT || '22' }}
        run: |
          ssh -p "$PORT" -i ~/.ssh/deploy_key -o ConnectTimeout=20 "$USER@$HOST" \
            'docker image prune -f >/dev/null 2>&1 || true; echo 已部署镜像：; docker images --format "{{.Repository}}:{{.Tag}} {{.Size}}" | grep -E "nx-as|on-devplan" | head -6'
