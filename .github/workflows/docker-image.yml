name: Docker image

# 双镜像构建 → 推 GHCR（GitHub 的 Docker 镜像仓库）+ artifact 分发；
# 打了 v* tag 时把 full 镜像部署到 47 服务器（docker load，不走 registry——47 拉 GHCR 私有包需额外登录）
#
#   nx-as-base  —— 纯权限壳（nginx + nx-as，无主程序），供 `FROM ghcr.io/on-devplan/nx-as-base` 派生
#   nx-as       —— 默认产品形态（base + pi-web 主进程）
on:
  push:
    tags: ['v*']
  workflow_dispatch:        # 手动触发：只构建 + 上传 artifact + 推 GHCR，不部署
    inputs:
      deploy:
        description: '同时部署到 47 服务器'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write           # 推 GHCR 需要

jobs:
  build:
    name: Build images & package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      full_image: ${{ steps.ghcr.outputs.full }}
      base_image: ${{ steps.ghcr.outputs.base }}
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号
        id: meta
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "image_tag=nx-as:$V" >> $GITHUB_OUTPUT
          echo "构建 nx-as:$V + nx-as-base:$V（GHCR 双镜像）"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR 镜像名（小写归一）
        id: ghcr
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "base=ghcr.io/${OWNER}/nx-as-base" >> "$GITHUB_OUTPUT"
          echo "full=ghcr.io/${OWNER}/nx-as" >> "$GITHUB_OUTPUT"

      # ── base：纯权限壳。先本地构建 + 冒烟，通过后才推 GHCR ──
      # 注意：不能在同一 build-push-action 里混「本地 tag + GHCR tag + push:true」——
      # buildx 会把 nx-as-base:local 当成 Docker Hub 的 library/nx-as-base 去推（实测 401）。
      - name: Build base 镜像（本地，供冒烟）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: base
          load: true
          push: false
          tags: |
            nx-as-base:${{ steps.meta.outputs.version }}
            nx-as-base:local
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: 冒烟：base 镜像（无主进程也要能起）
        run: |
          set +e
          docker run -d --name smoke-base -p 18090:8080 nx-as-base:local
          ok=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/_nxas/api/auth/verify 2>/dev/null)
            if [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then ok=true; break; fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "::error::base 镜像 120s 内未就绪"
            docker logs smoke-base --tail 60
            docker rm -f smoke-base
            exit 1
          fi
          echo "--- base 管理面探活 ---"
          curl -s http://127.0.0.1:18090/_nxas/api/auth/verify; echo
          echo "--- base 日志应含「纯权限壳模式」 ---"
          docker logs smoke-base 2>&1 | grep -q '纯权限壳模式' || { echo "::error::base 未进入纯权限壳模式"; docker logs smoke-base --tail 30; docker rm -f smoke-base; exit 1; }
          echo "--- 匿名 /（无主进程 → 502/302 均可，不可无响应）---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' http://127.0.0.1:18090/)
          echo "HTTP $code"
          docker rm -f smoke-base
          [ "$code" != "000" ] || { echo "::error::base 匿名 / 无响应"; exit 1; }
          echo "✅ base 镜像契约通过（网关就绪 + 纯权限壳模式）"

      - name: 推 base 到 GHCR
        run: |
          docker tag nx-as-base:${{ steps.meta.outputs.version }} ${{ steps.ghcr.outputs.base }}:${{ steps.meta.outputs.version }}
          docker tag nx-as-base:${{ steps.meta.outputs.version }} ${{ steps.ghcr.outputs.base }}:latest
          docker push ${{ steps.ghcr.outputs.base }}:${{ steps.meta.outputs.version }}
          docker push ${{ steps.ghcr.outputs.base }}:latest

      # ── full：base + pi-web。与 base 共享缓存，只多 pi-web 层 ──
      - name: Build full 镜像（本地，供冒烟）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: full
          load: true
          push: false
          tags: |
            nx-as:${{ steps.meta.outputs.version }}
            nx-as:local
          cache-from: |
            type=gha,scope=full
            type=gha,scope=base
          cache-to: type=gha,mode=max,scope=full

      - name: 冒烟：full 镜像（容器能起、面板可达、路径契约）
        run: |
          set +e   # 冒烟步骤禁用 -e：curl 4xx 是预期（匿名 401），用退出码断言
          docker run -d --name smoke -p 18080:8080 -e NX_AS_TOKEN=smoketoken nx-as:local
          ok=false
          for i in $(seq 1 90); do
            # 路径契约：nx-as 全在 /_nxas/*（唯一命名空间）
            # 任意 <500 的响应都说明 nginx + nx-as 已就绪（200=管理面，302=引导登录页）
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/_nxas/api/auth/verify 2>/dev/null)
            if [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then ok=true; break; fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "::error::容器 180s 内未就绪"
            docker logs smoke --tail 80
            docker rm -f smoke
            exit 1
          fi
          echo "--- nx-as 管理面探活 ---"
          curl -s http://127.0.0.1:18080/_nxas/api/auth/verify; echo
          echo "--- 主进程已拉起（pi-web 就绪日志）---"
          docker logs smoke 2>&1 | grep -q '启动主进程' || { echo "::error::full 镜像未启动 pi-web 主进程"; docker logs smoke --tail 40; docker rm -f smoke; exit 1; }
          echo "--- 匿名 /（应 302 到 /_nxas/login）---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' http://127.0.0.1:18080/)
          echo "HTTP $code"
          echo "--- 匿名 /_nxas/m/v1/sessions（应 401）---"
          code2=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/_nxas/m/v1/sessions)
          echo "HTTP $code2"
          docker logs smoke --tail 30
          docker rm -f smoke
          [ "$code" = "302" ] || { echo "::error::匿名 / 应 302 登录页，实得 $code"; exit 1; }
          [ "$code2" = "401" ] || { echo "::error::匿名 API 应 401，实得 $code2"; exit 1; }
          echo "✅ full 镜像契约验证通过（/ → 302 登录页；/_nxas/m/v1 → 401）"

      - name: 推 full 到 GHCR
        run: |
          docker tag nx-as:${{ steps.meta.outputs.version }} ${{ steps.ghcr.outputs.full }}:${{ steps.meta.outputs.version }}
          docker tag nx-as:${{ steps.meta.outputs.version }} ${{ steps.ghcr.outputs.full }}:latest
          docker push ${{ steps.ghcr.outputs.full }}:${{ steps.meta.outputs.version }}
          docker push ${{ steps.ghcr.outputs.full }}:latest

      - name: 打印 GHCR 推送结果
        run: |
          echo "### GHCR 镜像" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.ghcr.outputs.base }}:${{ steps.meta.outputs.version }}\` （纯权限壳，FROM 派生用）" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.ghcr.outputs.full }}:${{ steps.meta.outputs.version }}\` （含 pi-web，直接运行）" >> $GITHUB_STEP_SUMMARY

      - name: docker save + gzip
        run: |
          docker save ${{ steps.meta.outputs.image_tag }} | gzip -1 > nx-as-image.tar.gz
          ls -lh nx-as-image.tar.gz
          sha256sum nx-as-image.tar.gz | tee nx-as-image.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nx-as-image-${{ steps.meta.outputs.version }}
          path: |
            nx-as-image.tar.gz
            nx-as-image.tar.gz.sha256
            docker-compose.yml
          retention-days: 30

  deploy-47:
    name: Deploy to 47 server
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy == true
    env:
      VERSION: ${{ needs.build.outputs.version }}
      IMAGE: ${{ needs.build.outputs.full_image }}
    steps:
      - uses: actions/checkout@v4

      # 部署通道：docker save | gzip **流式管道**直达 47 的 docker load。
      # 为什么不用 appleboy/scp-action：253MB 经它中转多次实测挂起（40min+ 无进展）。
      # 为什么不用 GHCR 拉取：47 实测 docker pull 该镜像 6m54s，而压缩流式上传同尺寸约 1/3 时间。
      # 实测依据（2026-09-29）：47→GHCR 延迟 0.57s 但吞吐仅 0.6MB/s；本机→47 管道 2.4MB/s。
      - name: 准备 SSH
        env:
          SSH_KEY: ${{ secrets.SSH47_KEY }}
          HOST: ${{ secrets.SSH47_HOST }}
          PORT: ${{ secrets.SSH47_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 流式上传并 load（docker save | gzip | ssh docker load）
        env:
          HOST: ${{ secrets.SSH47_HOST }}
          USER: ${{ secrets.SSH47_USER || 'root' }}
          PORT: ${{ secrets.SSH47_PORT || '22' }}
        run: |
          set -o pipefail
          SIZE=$(docker image inspect "$IMAGE:$VERSION" --format '{{.Size}}')
          echo "镜像大小: $((SIZE/1024/1024)) MB (${IMAGE}:${VERSION})"
          # -1 最快压缩：瓶颈是链路不是 CPU，压缩率够用即可
          docker save "$IMAGE:$VERSION" | gzip -1 | ssh -p "$PORT" -i ~/.ssh/deploy_key \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$USER@$HOST" "docker load"

      - name: 写 compose + 起服务 + 健康检查
        env:
          HOST: ${{ secrets.SSH47_HOST }}
          USER: ${{ secrets.SSH47_USER || 'root' }}
          PORT: ${{ secrets.SSH47_PORT || '22' }}
        run: |
          ssh -p "$PORT" -i ~/.ssh/deploy_key -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$USER@$HOST" \
            'VERSION='"$VERSION"' IMAGE='"$IMAGE"' sh -s' <<'REMOTE'
          set -e
          cd /opt/nx-as
          mkdir -p data

          # compose 由 CI 生成（单一事实来源；不再从服务器外挂旧模板/compose → 根治版本漂移）
          cat > docker-compose.yml <<COMPOSE_EOF
          services:
            nx-as:
              image: ${IMAGE}:${VERSION}
              container_name: nx-as
              ports:
                - "18080:8080"
              volumes:
                - ./data:/data
              environment:
                NX_AS_STORE: /data/store.json
                NX_AS_TOKEN: \${NX_AS_TOKEN:-}
              restart: unless-stopped
              mem_limit: 700m
              logging:
                driver: json-file
                options: { max-size: "10m", max-file: "3" }
          COMPOSE_EOF

          docker compose up -d --force-recreate

          echo "健康检查..."
          ok=false
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18080/_nxas/api/auth/verify >/dev/null 2>&1; then ok=true; break; fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "健康检查失败，容器日志："
            docker compose logs --tail 100
            exit 1
          fi
          echo "容器内探活 OK"
          curl -s http://127.0.0.1:18080/_nxas/api/auth/verify; echo
          docker compose ps
          REMOTE

      - name: 清理旧镜像
        env:
          HOST: ${{ secrets.SSH47_HOST }}
          USER: ${{ secrets.SSH47_USER || 'root' }}
          PORT: ${{ secrets.SSH47_PORT || '22' }}
        run: |
          ssh -p "$PORT" -i ~/.ssh/deploy_key -o ConnectTimeout=20 "$USER@$HOST" \
            'docker image prune -f >/dev/null 2>&1 || true; echo 已部署镜像：; docker images --format "{{.Repository}}:{{.Tag}} {{.Size}}" | grep -E "nx-as|ghcr.io/on-devplan" | head -5'
