name: gost-as image

# gost-as 镜像自动构建：与 nx-as 发版节奏同步（v* tag） + 手动 dispatch
# 推送目标：ghcr.io/on-devplan/gost-as
# 镜像内容（Dockerfile target `gost`）：gost relay + nginx（公网鉴权入口） + nx-as
# 镜像与文档：docs/gost-as.md（部署/注册/安全模型）；scripts/nxas-tunnel.mjs（端口映射 CLI）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push gost-as image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读版本号
        id: meta
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "构建 gost-as:$V"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像名（小写归一）
        id: img
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/gost-as" >> "$GITHUB_OUTPUT"

      - name: Build gost-as 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: gost
          load: true
          push: false
          tags: |
            gost-as:${{ steps.meta.outputs.version }}
            gost-as:local
          cache-from: type=gha,scope=gost-as
          cache-to: type=gha,mode=max,scope=gost-as

      - name: 冒烟（gost-as 三进程：nginx 入口 + gost relay + nx-as 网关）
        run: |
          set +e
          docker run -d --name smoke-gostas \
            -e NXAS_OIDC_ENFORCE=0 \
            -e NXAS_OIDC_ISSUER=http://127.0.0.1:1 \
            -e NXAS_OIDC_CLIENT_ID=ci-smoke \
            -e NXAS_OIDC_ALLOWED_EMAILS=ci@example.com \
            -p 18090:8090 \
            gost-as:local
          ok=false
          # 关键：必须显式排除 000（curl 连接失败时返回 000，0<500 为真会立刻 break）
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/api/auth/verify 2>/dev/null)
            if [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then ok=true; break; fi
            sleep 2
          done
          if [ "$ok" != true ]; then
            echo "::error::gost-as 镜像 120s 内未就绪"
            docker logs smoke-gostas --tail 60
            docker rm -f smoke-gostas
            exit 1
          fi
          curl -s http://127.0.0.1:18090/api/auth/verify; echo
          # 验证三进程日志
          docker logs smoke-gostas 2>&1 | grep -E 'gost-as|gost relay|nginx 主入口' | head -5
          # 关键契约：gost relay 监听 + nx-as 网关监听
          docker logs smoke-gostas 2>&1 | grep -q 'gost relay 监听' || { echo "::error::gost relay 未就绪"; docker logs smoke-gostas; docker rm -f smoke-gostas; exit 1; }
          docker logs smoke-gostas 2>&1 | grep -q 'nx-as 网关 127.0.0.1:7801' || { echo "::error::nx-as 网关未就绪"; docker logs smoke-gostas; docker rm -f smoke-gostas; exit 1; }
          docker rm -f smoke-gostas
          echo "✅ gost-as 契约通过（nx-as 网关就绪 + gost relay 就绪 + 隧道入口正常）"

      - name: 推 gost-as 到 GHCR
        run: |
          docker tag gost-as:${{ steps.meta.outputs.version }} ${{ steps.img.outputs.name }}:${{ steps.meta.outputs.version }}
          docker tag gost-as:${{ steps.meta.outputs.version }} ${{ steps.img.outputs.name }}:latest
          docker push ${{ steps.img.outputs.name }}:${{ steps.meta.outputs.version }}
          docker push ${{ steps.img.outputs.name }}:latest

      - name: GHCR 推送结果
        run: |
          {
            echo "### GHCR 镜像"
            echo "- [${{ steps.img.outputs.name }}:${{ steps.meta.outputs.version }}]（gost + nginx + nx-as，安全内网穿透鉴权基座）"
            echo "- [${{ steps.img.outputs.name }}:latest]（自动指向最新版本）"
            echo ""
            echo "**部署到 47**（手动）："
            echo '```bash'
            echo 'ssh 47 "cd /opt/gost-as && docker compose pull && docker compose up -d"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
