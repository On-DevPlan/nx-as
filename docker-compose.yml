# nx-as 单容器部署（47 服务器 /opt/nx-as/docker-compose.yml）
# 镜像由 CI 构建经 docker save/load 分发（tag nx-as:0.4.1 是 artifact 内部 tag，load 后重打 local）
# 默认 HTTP；启用 HTTPS：面板「证书」导入后加 NXAS_TLS_PORT 环境变量
services:
  nx-as:
    image: nx-as:local
    container_name: nx-as
    ports:
      - "18080:8080"   # 公网 HTTP 入口（47 上 8443/8080 被 gost 占用）
    volumes:
      - ./data:/data   # store.json / audit.jsonl / pi-agent（会话+扩展+凭据）
      - ./docker/nginx.conf.template:/etc/nginx/http.d/nx-as.conf.template:ro
    environment:
      NX_AS_STORE: /data/store.json
      NXAS_DOMAIN: ${NXAS_DOMAIN:-nx-as.local}
      NX_AS_TOKEN: ${NX_AS_TOKEN:-}   # 管理密钥；留空则首启自动生成（docker logs 查看）
    restart: unless-stopped
    mem_limit: 700m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
